{% extends "base.html" %}
{% block title %}Login · PawHome{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body">
  <h3 class="mb-3">Login</h3>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 mb-0 text-center">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div></div></div></div>
{% endblock %}
